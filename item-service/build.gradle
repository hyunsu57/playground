// 아이템 서비스: H2에서 아이템 목록을 조회/관리하는 서비스
// Spring Web MVC + JPA + Spring Cache + H2(개발)/PostgreSQL(운영) 구성

plugins {
    id 'org.springframework.boot'
}

dependencies {
    // Spring Web MVC: REST API
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Data JPA: 아이템 ORM 처리
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Validation: @Valid, @NotBlank 등 요청 데이터 검증
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Cache: 목록 조회 캐싱 (Caffeine 로컬 캐시 사용)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // H2: 개발/테스트용 인메모리 DB (dev 프로파일)
    runtimeOnly 'com.h2database:h2'

    // PostgreSQL: 운영 DB 드라이버 (prod 프로파일)
    runtimeOnly 'org.postgresql:postgresql'

    // 개발 중 자동 재시작 지원
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
