spring:
  application:
    name: auth-service
  profiles:
    active: dev

server:
  port: 8082

# JWT 서명 키 (gateway-service, blog-service와 동일한 값 사용)
jwt:
  secret: ${JWT_SECRET:playground-dev-secret-key-must-be-at-least-256-bits-long}

---
# ===== dev 프로파일: 로컬 개발 환경 =====
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# ===== prod 프로파일: Render.com 운영 환경 =====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
