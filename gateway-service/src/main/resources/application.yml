spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # ===== 라우팅 규칙 =====
      routes:
        # 블로그 서비스 라우팅: 게시글/카테고리 관련 요청 → blog-service(8081)
        - id: blog-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/posts/**,/api/categories/**

        # 인증 서비스 라우팅: 로그인/회원가입 관련 요청 → auth-service(8082)
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**
        - id: api-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/external/**

        # 아이템 서비스 라우팅: 아이템 CRUD 요청 → item-service(8084)
        - id: item-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/items/**

        # 웹소켓 서비스 라우팅: 채팅 REST API → websocket-service(8085)
        - id: websocket-service-api
          uri: http://localhost:8085
          predicates:
            - Path=/api/chat/**

        # 웹소켓 서비스 라우팅: WebSocket 핸드셰이크/SockJS 연결 → websocket-service(8085)
        # lb:ws:// 대신 ws:// 또는 http://를 사용 (Spring Cloud Gateway가 WebSocket 업그레이드 자동 처리)
        - id: websocket-service-ws
          uri: ws://localhost:8085
          predicates:
            - Path=/ws/**

        # Java 21 멀티스레드 데모 서비스 → multiThread-service(8086)
        - id: multithread-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/multithread/**

      # ===== 전역 CORS 설정 =====
      # 프론트엔드(3000) → 게이트웨이(8080) 교차 출처 요청 허용
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

server:
  port: 8080

# JWT 서명 키 (운영 환경에서는 반드시 환경변수로 주입)
jwt:
  secret: ${JWT_SECRET:playground-dev-secret-key-must-be-at-least-256-bits-long}
